name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lab/shared build
      - run: pnpm --filter @lab/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @lab/web build

  test-api:
    name: test-be
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lab:lab@127.0.0.1:5432/lab?schema=public
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lab/shared build
      - run: pnpm --filter @lab/api prisma:generate
      - name: migrate from empty database
        run: pnpm --filter @lab/api prisma:migrate:deploy
      - run: pnpm --filter @lab/api test
      - name: reset and re-apply migrations
        run: |
          docker run --rm --network host postgres:16.11-alpine \
            psql "postgresql://lab:lab@127.0.0.1:5432/lab" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          pnpm --filter @lab/api prisma:migrate:deploy

  test-web:
    name: test-fe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lab/shared build
      - run: pnpm --filter @lab/web test
      - run: pnpm --filter @lab/web build
